<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic RAG Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2><i class="fas fa-brain"></i> Knowledge Base</h2>
            <div class="upload-section">
                <label class="custom-file-upload">
                    <input type="file" id="pdf-input" multiple accept=".pdf">
                    <i class="fas fa-cloud-upload-alt"></i> Choose PDFs
                </label>
                <div id="file-list" class="file-list">No files selected</div>
                <button id="upload-btn" class="primary-btn">Process Documents</button>
            </div>

            <div id="status-container" class="status-container hidden">
                <p id="status-text">Ready to upload...</p>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>
        </aside>

        <main class="chat-area">
            <header class="chat-header">
                <h3>Agentic RAG Session</h3>
                <span id="connection-status" class="badge">FastAPI + LangGraph Ready</span>
            </header>

            <div id="chat-window" class="chat-window">
                <div class="message bot-message">
                    Hello! Upload your PDFs in the sidebar to begin our context-aware session.
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="user-input" placeholder="Upload PDFs to enable chat..." disabled>
                    <button id="send-btn" disabled><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
